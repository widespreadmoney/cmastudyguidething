    {"id": "general-10", "topic": "general", "type": "choice", "difficulty": "intermediate", "prompt": "Which chart entry is most objective?", "options": ["“Patient walked approximately 10 feet and stopped twice.”", "“Patient acted lazy.”", "“Patient was probably faking discomfort.”", "“Patient seemed difficult as usual.”"], "answer": 0, "explanation": "Describe observable actions and measured findings rather than assigning motives or labels."},
    {"id": "general-11", "topic": "general", "type": "choice", "difficulty": "advanced", "prompt": "A staff member discovers a signed note contains a factual error. What is the best documentation principle?", "options": ["Use the approved correction or addendum workflow and preserve the audit trail", "Delete the original record and start over", "Change the other author's note under their login", "Backdate a replacement so it looks original"], "answer": 0, "explanation": "A traceable correction preserves record integrity. Follow the electronic system and organizational policies."},
    {"id": "general-12", "topic": "general", "type": "choice", "difficulty": "intermediate", "prompt": "What is the best way to support communication during a visit when a language barrier prevents reliable understanding?", "options": ["Use a qualified interpreter through the organization’s process", "Ask an untrained child to interpret technical details", "Repeat the same words more loudly", "Depend only on the patient's gestures"], "answer": 0, "explanation": "A qualified interpreter supports accuracy, privacy, and patient participation."},
    {"id": "general-13", "topic": "general", "type": "choice", "difficulty": "beginner", "prompt": "Which action best reflects patient autonomy?", "options": ["Respect a capable patient's informed refusal and notify the clinician", "Treat refusal as consent", "Threaten to withhold unrelated care", "Ask another patient to decide"], "answer": 0, "explanation": "Autonomy includes making and declining informed choices. The care team follows its communication and documentation policies."},
    {"id": "general-14", "topic": "general", "type": "choice", "difficulty": "intermediate", "prompt": "What does scope of practice describe?", "options": ["The tasks and responsibilities a role may perform under applicable rules", "The building in which staff are assigned to work", "Only the list of duties listed in a job advertisement", "A patient's insurance network"], "answer": 0, "explanation": "Scope depends on applicable law, delegation, credentials, and workplace policy."},
    {"id": "general-15", "topic": "general", "type": "choice", "difficulty": "advanced", "prompt": "A vendor asks for a patient's electronic chart to fix a printer. What should the MA do?", "options": ["Use the approved support and privacy process before sharing patient information", "Send the entire chart to speed up troubleshooting", "Photograph the screen using a personal phone", "Post the chart in a public forum for help"], "answer": 0, "explanation": "Technical issues do not justify sharing a chart with an unverified recipient. Follow the organization's privacy and support rules."},
    {"id": "general-16", "topic": "general", "type": "choice", "difficulty": "beginner", "prompt": "Which word means between the ribs?", "options": ["Intercostal", "Subcutaneous", "Intravenous", "Periorbital"], "answer": 0, "explanation": "Inter- means between and costal refers to the ribs."},
    {"id": "general-17", "topic": "general", "type": "choice", "difficulty": "intermediate", "prompt": "Which behavior shows professional boundaries?", "options": ["Keep communications on authorized work channels", "Share a personal social account for private patient messages", "Promise a diagnosis without clinician review", "Discuss a patient's private case with friends"], "answer": 0, "explanation": "Authorized communication channels protect privacy and keep clinical messages in the appropriate workflow."},
    {"id": "general-18", "topic": "general", "type": "choice", "difficulty": "beginner", "prompt": "Which term describes a written account of what a patient reports and what staff observe or do?", "options": ["Clinical documentation", "Credentialing", "Remittance advice", "Inventory reconciliation"], "answer": 0, "explanation": "Clinical documentation records relevant observations, reported concerns, and actions in the health record."},
    {"id": "general-19", "topic": "general", "type": "choice", "difficulty": "intermediate", "prompt": "Which prefix means below or deficient?", "options": ["Hypo-", "Hyper-", "Peri-", "Endo-"], "answer": 0, "explanation": "Hypo- can describe a below-normal level, as in hypoglycemia."},
    {"id": "general-20", "topic": "general", "type": "choice", "difficulty": "advanced", "prompt": "An MA is unsure whether a new task is allowed in their role. What is the appropriate next step?", "options": ["Check applicable scope, delegation, and clinic policy with the supervisor", "Proceed because another employee once did it", "Perform it if the schedule is busy", "Ask the patient to authorize it instead"], "answer": 0, "explanation": "An MA verifies authorization before taking on an unfamiliar task. Patient permission does not expand role boundaries."},
    {"id": "general-21", "topic": "general", "type": "boolean", "difficulty": "beginner", "prompt": "A medical assistant should distinguish a patient’s reported symptom from a measured sign when documenting.", "options": ["True", "False"], "answer": 0, "explanation": "A symptom is experienced and reported. A sign is observed or measured."},
    {"id": "general-22", "topic": "general", "type": "boolean", "difficulty": "beginner", "prompt": "Passwords can safely be shared among authorized staff if everyone works in the same practice.", "options": ["True", "False"], "answer": 1, "explanation": "Individual credentials protect access controls and allow actions to remain attributable."},
    {"id": "general-23", "topic": "general", "type": "boolean", "difficulty": "beginner", "prompt": "A patient can ask questions before agreeing to a proposed procedure.", "options": ["True", "False"], "answer": 0, "explanation": "Informed decisions depend on an opportunity to understand relevant information and ask questions."},
    {"id": "general-24", "topic": "general", "type": "match", "difficulty": "intermediate", "prompt": "Match each term to its meaning.", "pairs": [["Medial", "Toward the body's midline"], ["Proximal", "Closer to the limb's attachment"], ["Posterior", "Toward the back of the body"]], "explanation": "These directional words use different anatomical reference points."},
    {"id": "general-25", "topic": "general", "type": "match", "difficulty": "intermediate", "prompt": "Match each communication skill to an example.", "pairs": [["Open-ended question", "“What have you noticed since yesterday?”"], ["Reflection", "“It sounds like the uncertainty is frustrating.”"], ["Teach-back", "“How will you explain the next step at home?”"]], "explanation": "Questions invite detail, reflections acknowledge meaning, and teach-back checks the clarity of an explanation."},
    {"id": "administrative-01", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "Which action best helps prevent creating a duplicate patient record?", "options": ["Search the existing patient index using approved identifiers", "Always create a new chart for every phone call", "Look up the patient's insurance plan only", "Use only the first name when searching"], "answer": 0, "explanation": "Checking reliable identifiers in existing records reduces duplicate chart creation."},
    {"id": "administrative-02", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "What is an insurance copayment?", "options": ["A fixed amount the plan may require for a covered service", "The full annual insurance premium", "A percentage always paid by the provider", "A payment made only after an appeal"], "answer": 0, "explanation": "A copayment is commonly a fixed patient amount. A plan's benefits determine when it applies."},
    {"id": "administrative-03", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "What does a deductible describe?", "options": ["An amount the member may pay before the plan pays for certain covered services", "The maximum a provider may spend on supplies", "The monthly premium for every plan", "A code describing a procedure"], "answer": 0, "explanation": "A deductible concerns how costs are shared. Coverage details vary by plan and service."},
    {"id": "administrative-04", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "What is the purpose of checking insurance eligibility before the visit?", "options": ["Confirm the coverage information available for the proposed date of service", "Guarantee that every claim will be paid", "Replace medical necessity review", "Create a new insurance policy"], "answer": 0, "explanation": "An eligibility response helps verify coverage and benefits. It does not guarantee payment."},
    {"id": "administrative-05", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "What does an ICD-10-CM diagnosis code communicate in a claim?", "options": ["A condition, symptom, or other reason for care", "Which employee made the appointment", "The patient’s credit card details", "The equipment's purchase date"], "answer": 0, "explanation": "Diagnosis codes describe the documented reason or condition for a healthcare service."},
    {"id": "administrative-06", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "What does a CPT code generally describe?", "options": ["A performed procedure or professional service", "A patient's insurance group number", "A diagnosis only", "A patient’s appointment reminder preference"], "answer": 0, "explanation": "CPT codes describe medical, surgical, and diagnostic services and procedures within their code set."},
    {"id": "administrative-07", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "A plan requires prior authorization. What does securing it usually indicate?", "options": ["The payer reviewed the request in advance under plan rules", "The service is automatically free", "The patient no longer needs an appointment", "The claim has been paid in full"], "answer": 0, "explanation": "Prior authorization is advance review. Payment still depends on coverage and other claim conditions."},
    {"id": "administrative-08", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "Which document typically explains how a payer processed a claim for the patient?", "options": ["Explanation of benefits", "Appointment confirmation", "Referral request", "Inventory report"], "answer": 0, "explanation": "An explanation of benefits summarizes payer processing and possible patient responsibility. It is different from a bill."},
    {"id": "administrative-09", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "What is the CMS-1500 form associated with?", "options": ["Paper billing for certain professional healthcare claims", "An inpatient hospital census", "A patient's medical history intake", "A stockroom purchase order"], "answer": 0, "explanation": "CMS-1500 is the paper professional claim form. The 837P is the standard electronic professional transaction."},
    {"id": "administrative-10", "topic": "administrative", "type": "choice", "difficulty": "advanced", "prompt": "A claim is rejected because the subscriber number has an extra digit. What is the reasonable first response?", "options": ["Verify and correct the subscriber data before resubmitting", "Change the diagnosis to force payment", "Post a patient balance without reviewing the rejection", "Submit the same claim repeatedly"], "answer": 0, "explanation": "A front-end data rejection should be corrected using reliable source information before resubmission."},
    {"id": "administrative-11", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "Which task is part of appointment scheduling?", "options": ["Confirm the visit type and appropriate appointment length", "Determine the patient's diagnosis from the scheduling note", "Select a medication for the visit", "Sign the provider's chart note"], "answer": 0, "explanation": "Correct visit type and duration help match patient needs to office resources."},
    {"id": "administrative-12", "topic": "administrative", "type": "choice", "difficulty": "advanced", "prompt": "A caller mentions a potentially urgent symptom while requesting an appointment. What is the most appropriate scheduling response?", "options": ["Follow the urgent-call protocol and route promptly to authorized staff", "Offer the next routine opening without escalation", "Give a diagnosis over the phone", "Tell the caller to wait until a portal message is read"], "answer": 0, "explanation": "Use the organization's escalation process for urgent concerns. Avoid independently diagnosing or treating the caller."},
    {"id": "administrative-13", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "Why should a reminder use the patient's documented contact preferences?", "options": ["To reach the patient while protecting privacy", "To communicate details to any available contact", "To replace identity verification", "To bypass an opt-out request"], "answer": 0, "explanation": "Preferences and office policy help prevent messages from going to unintended recipients."},
    {"id": "administrative-14", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "What is a sound first step when handling a request to release a record?", "options": ["Verify the requester and follow the approved disclosure workflow", "Send the record immediately to the email supplied", "Remove all documentation of the request", "Use a personal message service to transfer it"], "answer": 0, "explanation": "Verify identity and authority and follow the practice’s release procedures before disclosing information."},
    {"id": "administrative-15", "topic": "administrative", "type": "choice", "difficulty": "beginner", "prompt": "What is a superbill used to capture?", "options": ["Encounter services and diagnosis information for billing workflows", "Staff vacation accrual", "The test result for a single lab specimen", "A patient’s home medication supply"], "answer": 0, "explanation": "A superbill or encounter form collects encounter information used in charge entry and claim preparation."},
    {"id": "administrative-16", "topic": "administrative", "type": "choice", "difficulty": "intermediate", "prompt": "Which workflow helps track a referral that has not been completed?", "options": ["Use a referral queue and follow up according to protocol", "Close the referral once the fax is sent", "Wait indefinitely for the patient to call", "Delete the referral if the specialist has not responded"], "answer": 0, "explanation": "A tracking queue lets staff identify outstanding referrals and document follow-up."},

    {"id": "administrative-19", "topic": "administrative", "type": "choice", "difficulty": "advanced", "prompt": "What should staff do when a payer denies a claim for missing documentation?", "options": ["Review the reason and follow the correction or appeal process", "Create a new patient identity for the claim", "Write a service into the chart that was never performed", "Ignore the denial until the filing deadline passes"], "answer": 0, "explanation": "The denial reason guides next steps. Documentation changes must reflect what actually occurred."},

    {"id": "administrative-21", "topic": "administrative", "type": "boolean", "difficulty": "beginner", "prompt": "A referral and prior authorization can be separate requirements.", "options": ["True", "False"], "answer": 0, "explanation": "A referral directs a patient to another service or clinician. A payer may separately require approval in advance."},
    {"id": "administrative-22", "topic": "administrative", "type": "boolean", "difficulty": "beginner", "prompt": "An explanation of benefits is a bill requesting immediate payment from the patient.", "options": ["True", "False"], "answer": 1, "explanation": "It reports how a claim was processed. A bill is a separate request for payment."},
    {"id": "administrative-23", "topic": "administrative", "type": "boolean", "difficulty": "beginner", "prompt": "When a patient moves, staff should create a new chart instead of updating the existing record.", "options": ["True", "False"], "answer": 1, "explanation": "Update the correct existing chart after verifying identity. A second chart can fragment information."},
    {"id": "administrative-24", "topic": "administrative", "type": "match", "difficulty": "intermediate", "prompt": "Match each billing concept to its description.", "pairs": [["Copayment", "Fixed amount for a covered service under a plan"], ["Coinsurance", "Percentage share of an allowed cost"], ["Premium", "Recurring cost to maintain coverage"]], "explanation": "The terms describe different ways coverage and services are paid for."},
    {"id": "administrative-25", "topic": "administrative", "type": "match", "difficulty": "intermediate", "prompt": "Match each office workflow to its purpose.", "pairs": [["Eligibility check", "Verify available insurance coverage information"], ["Charge entry", "Record documented services for billing"], ["Payment posting", "Record payments and adjustments"]], "explanation": "These steps occur at different stages of the revenue cycle."},
    {"id": "clinical-01", "topic": "clinical", "type": "choice", "difficulty": "beginner", "prompt": "Which pair is commonly appropriate for verifying patient identity before care?", "options": ["Full name and date of birth", "Room number and chair color", "First name and appointment time", "Clinician name and chart color"], "answer": 0, "explanation": "Use two approved patient identifiers. Physical location is not a reliable identifier."},

    {"id": "clinical-03", "topic": "clinical", "type": "choice", "difficulty": "intermediate", "prompt": "After removing gloves at the end of a patient-care task, what action remains important?", "options": ["Perform hand hygiene", "Use the same gloves on another patient", "Wash gloves for reuse", "Skip hand hygiene if the gloves look clean"], "answer": 0, "explanation": "Hands can become contaminated during glove removal or through defects in gloves."},
    {"id": "clinical-04", "topic": "clinical", "type": "choice", "difficulty": "beginner", "prompt": "What belongs in an approved sharps container immediately after use?", "options": ["A used needle", "A paper appointment reminder", "An unopened glove box", "A clean reusable blood pressure cuff"], "answer": 0, "explanation": "An appropriate sharps container reduces needlestick risk and supports safe disposal."},
    {"id": "clinical-05", "topic": "clinical", "type": "choice", "difficulty": "intermediate", "prompt": "How can using a blood pressure cuff that is too small affect the reading?", "options": ["It can give a falsely high reading", "It always gives a falsely low reading", "It has no effect if the patient is seated", "It changes only the patient's pulse"], "answer": 0, "explanation": "A cuff that is too small can overestimate blood pressure, which is why an appropriately sized cuff matters."},
    {"id": "clinical-06", "topic": "clinical", "type": "choice", "difficulty": "intermediate", "prompt": "What is the best documentation for a recorded temperature of 37.2 °C measured orally?", "options": ["Record the value, unit, and oral route", "Record “normal” and omit the measurement", "Round it to 40 °C", "Record a different route if the system defaults to it"], "answer": 0, "explanation": "The unit and measurement route help other staff interpret and compare readings."},

    {"id": "clinical-10", "topic": "clinical", "type": "choice", "difficulty": "intermediate", "prompt": "What is one possible source of ECG artifact?", "options": ["Patient motion or poor electrode contact", "A correct and stable connection", "Proper skin preparation by itself", "A complete patient name"], "answer": 0, "explanation": "Motion and poor contact can distort a tracing. Follow protocol to address artifact before forwarding it."},

    {"id": "clinical-12", "topic": "clinical", "type": "choice", "difficulty": "intermediate", "prompt": "A specimen arrives with no label. What is the correct quality principle?", "options": ["Follow the rejection or exception policy and notify appropriate staff", "Guess the identity from its location", "Label it with the first chart on the schedule", "Process it as normal without documenting the problem"], "answer": 0, "explanation": "An unlabeled specimen has uncertain identity. Follow the organization's procedure for resolving that uncertainty."},

    {"id": "clinical-14", "topic": "clinical", "type": "choice", "difficulty": "beginner", "prompt": "What is the term for a procedure that eliminates all forms of microbial life, including bacterial spores?", "options": ["Sterilization", "Routine cleaning", "Low-level disinfection", "Hand washing only"], "answer": 0, "explanation": "Sterilization has a broader endpoint than ordinary disinfection, including bacterial spores."},

    {"id": "clinical-21", "topic": "clinical", "type": "boolean", "difficulty": "beginner", "prompt": "The kind of PPE needed depends on anticipated exposure during the task.", "options": ["True", "False"], "answer": 0, "explanation": "Select PPE to protect against the expected contact, splash, or other exposure risk."},
    {"id": "clinical-22", "topic": "clinical", "type": "boolean", "difficulty": "beginner", "prompt": "A patient's room number is an acceptable substitute for one approved patient identifier.", "options": ["True", "False"], "answer": 1, "explanation": "Room assignment can change and does not reliably establish identity."},
    {"id": "clinical-23", "topic": "clinical", "type": "boolean", "difficulty": "beginner", "prompt": "A single unexpected measurement may warrant checking technique and reporting according to protocol.", "options": ["True", "False"], "answer": 0, "explanation": "Technique can affect measurements. Reporting requirements and urgent findings must still be handled promptly."},
    {"id": "clinical-24", "topic": "clinical", "type": "match", "difficulty": "intermediate", "prompt": "Match each measurement to its typical unit.", "pairs": [["Blood pressure", "Millimeters of mercury"], ["Pulse", "Beats per minute"], ["Temperature", "Degrees Celsius or Fahrenheit"]], "explanation": "Recording the correct unit keeps a measurement interpretable."},
    {"id": "clinical-25", "topic": "clinical", "type": "match", "difficulty": "intermediate", "prompt": "Match each safety term to its meaning.", "pairs": [["Aseptic technique", "Practices to reduce contamination during a task"], ["Disinfection", "Process that inactivates many microorganisms on objects"], ["Sterilization", "Process intended to eliminate all microbial life"]], "explanation": "Each term describes a different level or method of contamination control."}

  {"id": "skeletal", "title": "Skeletal system", "group": "anatomy", "tagline": "Bones, joints, and support", "summary": "Bones support the body, protect organs, and give muscles places to pull. They also store minerals and house marrow that makes blood cells. Joints connect bones and differ in how much movement they allow.", "terms": [["Axial skeleton", "The central framework formed by the skull, spine, ribs, and sternum."], ["Appendicular skeleton", "The limb bones and the shoulder and pelvic girdles that attach them."], ["Compact bone", "Dense bone that makes up the strong outer shell of most bones."], ["Trabecula", "One of the small struts that form the network inside spongy bone."], ["Red marrow", "Soft tissue inside some bones that produces blood cells."], ["Osteoblast", "A cell that builds new bone matrix."], ["Osteoclast", "A cell that breaks down and resorbs bone."], ["Synovial joint", "A joint with a fluid-filled space that usually allows substantial movement."], ["Ligament", "A band of connective tissue that often links bones and stabilizes a joint."]], "outline": [], "resources": [61, 62, 60, 32, 31]},

  {"id": "cardiovascular", "title": "Cardiovascular system", "group": "anatomy", "tagline": "Heart, vessels, and blood", "summary": "The heart pumps blood through the lungs for gas exchange and through the rest of the body to deliver oxygen and nutrients. Arteries and veins carry blood between the heart and tissues, and capillaries provide an exchange surface. Blood also transports immune cells, hormones, and wastes.", "terms": [["Atrium", "An upper heart chamber that receives blood."], ["Ventricle", "A lower heart chamber that pumps blood out of the heart."], ["Artery", "A vessel that carries blood away from the heart."], ["Vein", "A vessel that carries blood toward the heart."], ["Capillary", "A tiny vessel where gases, water, and other substances can move between blood and tissues."], ["Systole", "The contraction phase of a heart chamber."], ["Diastole", "The relaxation and filling phase of a heart chamber."], ["Hemoglobin", "The protein in red blood cells that carries most of the oxygen in blood."], ["Platelet", "A small blood cell fragment that helps form a plug at a damaged vessel."]], "outline": [], "resources": [5, 7, 6, 10, 0, 2]},

  {"id": "lymphatic", "title": "Lymphatic and immune systems", "group": "anatomy", "tagline": "Fluid return and defense", "summary": "Lymphatic vessels pick up excess tissue fluid and return it to the blood. Lymph nodes, the thymus, and the spleen support different parts of immune defense. Innate defenses act quickly, while adaptive defenses target particular antigens and can develop memory.", "terms": [["Lymph", "Interstitial fluid that has entered a lymphatic vessel."], ["Lymph node", "A small organ that filters lymph and brings immune cells into contact with its contents."], ["Spleen", "An organ that filters blood and supports immune responses to material in it."], ["Thymus", "An organ where developing T lymphocytes mature."], ["Lacteal", "A lymphatic capillary inside an intestinal villus that absorbs many dietary fats."], ["Antigen", "A substance or part of a substance that can be recognized by an immune receptor."], ["Antibody", "A protein that binds a particular antigen."], ["Innate immunity", "Quick defenses that respond to common features of injury or infection."], ["Adaptive immunity", "Targeted defenses driven by B and T cells that can build memory."]], "outline": [], "resources": [35, 36, 37, 38]},
  {"id": "nervous", "title": "Nervous system", "group": "anatomy", "tagline": "Signals, control, and coordination", "summary": "The brain and spinal cord integrate information from the body and surroundings. Peripheral nerves connect them to receptors, muscles, and organs. Neurons carry signals, while supporting cells maintain the conditions that let those signals travel.", "terms": [["Central nervous system", "The brain and spinal cord."], ["Peripheral nervous system", "Nerves and related structures outside the brain and spinal cord."], ["Neuron", "A cell specialized for transmitting information."], ["Dendrite", "A neuron branch that commonly receives signals."], ["Axon", "A long projection that usually carries a signal away from the cell body."], ["Myelin", "An insulating layer that speeds conduction along many axons."], ["Synapse", "A junction where one cell passes a signal to another."], ["Afferent pathway", "A pathway carrying signals toward the central nervous system."], ["Autonomic nervous system", "Neural pathways that regulate functions such as heart rate and digestion."]], "outline": [], "resources": [45, 46, 47, 43, 44]},
  {"id": "endocrine", "title": "Endocrine system", "group": "anatomy", "tagline": "Hormones and feedback", "summary": "Endocrine tissues send chemical signals called hormones through circulation. Hormones act on cells with suitable receptors to coordinate metabolism, growth, reproduction, and fluid balance. Many hormone levels are controlled by feedback.", "terms": [["Hormone", "A chemical messenger that changes activity in cells with suitable receptors."], ["Target cell", "A cell able to respond to a particular messenger."], ["Hypothalamus", "A brain region that helps coordinate hormone regulation and other aspects of internal balance."], ["Pituitary gland", "A gland beneath the brain that releases hormones controlling many body functions."], ["Insulin", "A pancreatic hormone that helps lower blood glucose."], ["Glucagon", "A pancreatic hormone that helps raise blood glucose when it falls."], ["Cortisol", "An adrenal cortex hormone involved in metabolism and stress responses."], ["Antidiuretic hormone (ADH)", "A hormone that helps the kidneys conserve water."], ["Negative feedback", "Regulation in which a change triggers a response that counteracts it."]], "outline": [], "resources": [18, 20, 21, 19, 17]},
  {"id": "digestive", "title": "Digestive system", "group": "anatomy", "tagline": "Breakdown, absorption, and elimination", "summary": "The digestive tract moves food, breaks it into smaller molecules, absorbs useful nutrients, and eliminates what remains. The liver, gallbladder, and pancreas aid digestion by supplying bile, enzymes, and bicarbonate.", "terms": [["Bolus", "A mass of chewed food or other material being swallowed."], ["Peristalsis", "Coordinated waves of muscle contraction that propel material along a tube."], ["Chyme", "A semifluid mixture of partly digested food and stomach secretions."], ["Duodenum", "The first section of the small intestine, just beyond the stomach."], ["Villus", "A small projection of the intestinal lining that increases its absorption area."], ["Bile", "A liver secretion that helps disperse fat into smaller droplets."], ["Pancreatic bicarbonate", "An alkaline secretion that helps reduce the acidity of material entering the duodenum."], ["Amylase", "An enzyme that helps break starch into smaller carbohydrates."], ["Colon", "The largest portion of the large intestine, where some remaining water is recovered."]], "outline": [], "resources": [12, 15, 14, 16]},
  {"id": "urinary", "title": "Urinary system", "group": "anatomy", "tagline": "Filtration and fluid balance", "summary": "The kidneys filter blood and adjust the amounts of water, salts, and wastes that leave the body. Urine passes through the ureters to the bladder and leaves through the urethra. Kidney function also contributes to acid–base balance and blood pressure regulation.", "terms": [["Nephron", "A kidney unit that filters blood and modifies the filtrate."], ["Glomerulus", "A tiny network of capillaries that begins filtration."], ["Bowman’s capsule", "The cup-shaped structure that collects the fluid filtered by the glomerulus."], ["Reabsorption", "Movement of substances from tubular fluid back to the blood."], ["Tubular secretion", "Movement of substances from blood into the fluid inside a kidney tubule."], ["Renal pelvis", "A funnel-shaped space that collects urine and leads into the ureter."], ["Ureter", "A tube that carries urine from a kidney to the bladder."], ["Urinary bladder", "A hollow muscular organ that stores urine."], ["Urethra", "The tube that carries urine from the bladder out of the body."]], "outline": [], "resources": [69, 68, 71, 73]},
  {"id": "reproductive", "title": "Reproductive systems", "group": "anatomy", "tagline": "Gametes, hormones, and reproduction", "summary": "Reproductive organs produce sex cells and hormones. The testes produce sperm, and the ovaries contain follicles that can release oocytes. Fertilization commonly occurs in a uterine tube, and development after implantation normally takes place in the uterus.", "terms": [["Gamete", "A reproductive cell, such as a sperm cell or an oocyte."], ["Seminiferous tubule", "A coiled tube in a testis where sperm cells are produced."], ["Epididymis", "A tube along the testis where sperm mature and are stored."], ["Ductus deferens", "A tube that carries sperm from the epididymis toward the ejaculatory duct."], ["Ovarian follicle", "A structure that surrounds and supports a developing oocyte."], ["Ovulation", "Release of an oocyte from an ovarian follicle."], ["Corpus luteum", "Temporary tissue left by a follicle after ovulation that releases progesterone."], ["Endometrium", "The inner lining of the uterus, where implantation usually occurs."], ["Cervix", "The lower, narrow part of the uterus that opens toward the vagina."]], "outline": [], "resources": [48, 50, 51, 49, 53]},
  {"id": "integumentary", "title": "Integumentary system", "group": "anatomy", "tagline": "Skin, hair, nails, and glands", "summary": "The skin forms a barrier, helps regulate temperature, and houses receptors for touch and other sensations. Hair, nails, and glands are related structures. The underlying tissue helps cushion and insulate the body.", "terms": [["Epidermis", "The protective outer layer of the skin."], ["Dermis", "The deeper skin layer holding blood vessels, nerves, follicles, and glands."], ["Hypodermis", "Tissue beneath the skin that often contains substantial fat."], ["Keratinocyte", "A main epidermal cell that makes keratin and helps form the skin barrier."], ["Melanocyte", "A pigment-producing cell found in the epidermis."], ["Sebaceous gland", "A gland that secretes an oily substance called sebum, often into a hair follicle."], ["Eccrine sweat gland", "A gland that releases watery sweat onto the skin surface."], ["Arrector pili", "A small muscle attached to a hair follicle that can cause a goosebump."], ["Hair follicle", "A pocket in the skin where a hair forms and grows."]], "outline": [], "resources": [26, 24, 27, 25, 23]},
  {"id": "senses", "title": "Special senses", "group": "anatomy", "tagline": "Vision, hearing, balance, smell, and taste", "summary": "The special senses use receptors in specialized organs. The eyes detect light, the ears detect sound and head movement, and chemoreceptors in the nose and mouth detect odors and tastes.", "terms": [["Cornea", "The transparent front surface of the eye that bends incoming light."], ["Iris", "The colored ring of muscle that controls pupil size."], ["Retina", "A light-sensitive layer at the back of the eye."], ["Rod", "A photoreceptor especially sensitive in dim light."], ["Cone", "A photoreceptor important for color and sharp detail in brighter light."], ["Tympanic membrane", "The eardrum, which vibrates in response to sound."], ["Cochlea", "The spiral inner-ear structure involved in hearing."], ["Semicircular ducts", "Three inner-ear ducts that detect rotational head movement."], ["Olfactory receptor", "A sensory receptor that responds to odor molecules."], ["Taste bud", "A cluster of cells that detect dissolved taste chemicals."]], "outline": [], "resources": [65, 64, 66, 63]},
  {"id": "general", "title": "General", "group": "cma", "tagline": "Communication, ethics, and terminology", "summary": "Build the shared skills used across medical assisting, from understanding medical language to communicating with patients and protecting their information. Study with the AAMA outline that applies to your exam date.", "terms": [["Protected health information (PHI)", "Individually identifiable health information subject to HIPAA’s definitions and exceptions."], ["Scope of practice", "The tasks and responsibilities a role may carry out under applicable rules."], ["Delegation", "Assigning a task to an authorized person within applicable rules and supervision."], ["Patient autonomy", "A person’s ability to make informed choices about their own care."], ["Teach-back", "Asking someone to explain instructions in their own words to check how clearly they were taught."], ["Subjective information", "What the patient or another source reports, such as a symptom."], ["Objective information", "What is observed or measured, such as a documented temperature."], ["Audit trail", "A traceable record of who accessed or changed information and when."], ["Health literacy", "The ability to find, understand, and use information and services to make health decisions."], ["Qualified interpreter", "A person with the language and interpreting skills required to communicate accurately in the care setting."]], "outline": [["Medical language and anatomy", "Break words into prefixes, roots, and suffixes. Use directional terms and body-system names when describing findings."], ["Communication and education", "Practice active listening, open-ended questions, teach-back, and appropriate use of qualified interpreters."], ["Law, ethics, and scope", "Review confidentiality, consent and refusal, role boundaries, delegation, and when to elevate decisions."], ["Professionalism and documentation", "Use objective wording, authorized communication channels, accurate attribution, and traceable corrections."]], "resources": [84, 83, 89, 90, 105, 108, 110]},
  {"id": "administrative", "title": "Administrative", "group": "cma", "tagline": "Scheduling, records, and billing", "summary": "Study how a medical office keeps a patient visit organized from scheduling and registration through billing, follow-up, and record management. Focus on what each step verifies and what it passes to the next person.", "terms": [["EHR", "Electronic health record used to document and coordinate care."], ["Eligibility verification", "A check of insurance coverage information for a particular time or service."], ["Prior authorization", "A payer’s review in advance for a service that requires approval under a plan."], ["Copayment", "A fixed amount a patient may owe for a covered service under a plan."], ["Coinsurance", "A percentage of an allowed cost the patient is responsible for under a plan."], ["Deductible", "An amount a member may have to pay before the plan pays for certain services."], ["ICD-10-CM", "A coding system for diagnoses, symptoms, and other reasons for care in the United States."], ["CPT", "A code set describing many medical procedures and professional services."], ["Explanation of benefits (EOB)", "A statement to the patient explaining how insurance processed a claim."], ["Remittance advice", "A payer’s statement to a practice explaining payments, adjustments, or denials."], ["CMS-1500", "A paper form used for certain professional healthcare claims."]], "outline": [["Scheduling and intake", "Confirm the visit type, approved identifiers, contact preferences, eligibility, and any referral requirements. Learn when to route concerns."], ["Health records and communication", "Review EHR access, release-of-information processes, documentation of messages, and referral tracking."], ["Coding and billing", "Distinguish diagnosis from service coding. Trace eligibility, authorization, charge entry, claims, remittances, and denials."], ["Office operations", "Practice inventory rotation, payment reconciliation, supply tracking, and handling discrepancies under policy."]], "resources": [84, 83, 75, 74, 78, 109]},
  {"id": "clinical", "title": "Clinical", "group": "cma", "tagline": "Patient care, safety, and testing", "summary": "Review the checks that support safe patient care in an outpatient setting. Study the purpose of each procedure and what to observe, document, verify, or report within the medical assistant’s role.", "terms": [["Standard Precautions", "Core infection-prevention practices used in all patient care and adapted to anticipated exposure."], ["Personal protective equipment (PPE)", "Items worn to reduce exposure to hazards such as body fluids."], ["Aseptic technique", "Steps that reduce contamination during patient care and procedures."], ["Sterilization", "A process designed to eliminate all forms of microbial life, including bacterial spores."], ["Disinfection", "A process that inactivates many disease-causing microorganisms on objects or surfaces."], ["Vital signs", "Core measurements such as pulse, blood pressure, temperature, and respirations."], ["Pulse oximetry", "A noninvasive estimate of peripheral oxygen saturation."], ["Electrocardiogram (ECG)", "A recording of the heart’s electrical activity from electrodes at the body surface."], ["Artifact", "An unwanted distortion caused by something other than the signal being measured."], ["Point-of-care testing", "Testing performed at or near the place where the patient receives care."], ["Quality control", "Checks that help determine whether testing equipment and processes are working as expected."]], "outline": [["Patient intake and vital signs", "Review approved identifiers, measurement methods, device fit, documentation, and escalation criteria in clinic protocols."], ["Infection prevention", "Distinguish Standard Precautions, PPE, hand hygiene, sharps safety, cleaning, disinfection, and sterilization."], ["Specimens and testing", "Connect patient identification, specimen labels, handling, point-of-care controls, and the need to report unreliable results."], ["Procedures and safety", "Review ECG basics, medication verification, routes, documentation, and the roles assigned in an emergency response."]], "resources": [84, 83, 80, 79, 81, 82, 104]}

function readProgress() {

    if (!next || typeof next !== "object") return blank();
    return {

      completed: next.completed && typeof next.completed === "object" ? next.completed : {},

      latest: validAttempt(next.latest) && next.latest.answers.length === next.latest.ids.length

  } catch {

function validAttempt(attempt) {
  return Boolean(attempt && Array.isArray(attempt.ids) && attempt.ids.length
    && attempt.ids.every(id => byQuestion.has(id)) && Array.isArray(attempt.orders)
    && attempt.orders.length === attempt.ids.length
    && Array.isArray(attempt.answers) && attempt.answers.length <= attempt.ids.length
    && Number.isInteger(attempt.index) && attempt.index >= 0 && attempt.index < attempt.ids.length);
}

let cardState = { topic: "all", unknownOnly: false, order: null, index: 0, flipped: false };
let resourceState = { query: "", category: "all" };
let lastRoute = "";
let lastImageTrigger = null;

function shuffle(items) {
  const copy = items.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function syncHeader() {
  const count = CHAPTERS.filter(chapter => progress.completed[chapter.id]).length;
  document.querySelector("#nav-progress").textContent = count + " / " + CHAPTERS.length;
  document.querySelector("#nav-progress-link").setAttribute("aria-label",
    "Progress, " + count + " of " + CHAPTERS.length + " quizzes completed");
}

function link(route, label, css = "") {
  return '<a class="' + esc(css) + '" href="#' + esc(route) + '">' + esc(label) + '</a>';
}

function outside(url, label) {
  return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"' + '>' + esc(label) + '</a>';
}

function sectionHead(title, description = "", parent = "") {
  return '<header class="page-heading">' + parent + '<h1 tabindex="-1">' + esc(title) + '</h1>'
    + (description ? '<p class="lead">' + esc(description) + '</p>' : "") + '</header>';
}

function changeRoute(route) {
  if (location.hash === "#" + route) renderRoute();
  else location.hash = route;
}

function readRoute() {
  const value = location.hash.slice(1);
  if (["home", "progress"].includes(value) || SECTIONS.some(([id]) => id === value) || byTopic.has(value)) return value;
  return "home";
}

function renderRoute(initial = false) {
  const route = readRoute();
  const chapter = byTopic.get(route);
  const activeSection = chapter?.group || route;
  document.querySelectorAll("[data-nav]").forEach(node => {
    const active = node.dataset.nav === activeSection;
    node.classList.toggle("active", active);
    if (active) node.setAttribute("aria-current", chapter ? "location" : "page");
    else node.removeAttribute("aria-current");
  });

  const pages = {
    home: renderHome,
    anatomy: () => renderDirectory("anatomy"),
    cma: () => renderDirectory("cma"),
    quizzes: renderQuizCenter,
    flashcards: renderFlashcards,
    resources: renderResources,
    credits: renderCredits,
    progress: renderProgress,
  };
  if (chapter) renderChapter(chapter);
  else pages[route]();
  const title = main.querySelector("h1");
  document.title = (title ? title.textContent + " · " : "") + "Anatomy & CMA Study Hub";
  if (!initial && route !== lastRoute) {
    window.scrollTo(0, 0);
    title?.focus({ preventScroll: true });
  }
  lastRoute = route;
  syncHeader();
}

function progressSummary() {
  const total = CHAPTERS.filter(chapter => progress.completed[chapter.id]).length;
  const known = termCards.filter(card => progress.known.includes(card.id)).length;
  return { total, known };
}

function renderDirectory(group) {
  const anatomy = group === "anatomy";
  const chapters = CHAPTERS.filter(ch => ch.group === group);
  main.innerHTML = sectionHead(anatomy ? "Anatomy" : "CMA Prep",
    anatomy ? "Explore 12 body systems with labeled illustrations, key terms, and practice."
      : "Study the three CMA (AAMA) exam areas with topic outlines and original practice questions.")
    + '<div class="tiles chapter-tiles">' + chapters.map(ch => `
      <a class="tile" href="#${ch.id}"><strong>${esc(ch.title)}</strong><span>${esc(ch.tagline)}</span>
      <small>${byTopicQuestionCount(ch.id)} questions · ${progress.completed[ch.id] ? "Completed" : "Not completed"}</small>
      <span class="arrow" aria-hidden="true">↗</span></a>`).join("") + "</div>";
}

function byTopicQuestionCount(id) {
  return QUESTIONS.filter(q => q.topic === id).length;
}

  const anatomy = chapter.group === "anatomy";
  const figures = FIGURES.filter(figure => figure.topic === chapter.id);
  const refs = chapter.resources.map(index => RESOURCES[index]);
  const hasActive = progress.active?.topic === chapter.id && !progress.active.retry;

  main.innerHTML = sectionHead(chapter.title, chapter.summary,
    link(chapter.group, anatomy ? "← Anatomy" : "← CMA Prep", "back-link"))
    + `<div class="chapter-actions">
      <button class="button primary" id="chapter-quiz">${hasActive ? "Resume" : "Start"} ${count}-question quiz</button>
      <button class="button secondary" id="chapter-cards">Study these flashcards</button>
      ${progress.completed[chapter.id] ? '<span class="badge good">Quiz completed</span>' : ""}
      </div>
      ${anatomy ? '<section class="section-block"><h2>Illustrations</h2><div class="gallery">'
        + figures.map(renderFigure).join("") + '</div></section>'
        : '<section class="section-block"><h2>Study guide outline</h2><ol class="outline">'
          + chapter.outline.map(([topic, detail]) => '<li><strong>' + esc(topic) + '</strong><p>' + esc(detail) + '</p></li>').join("")
          + '</ol></section>'}
      <section class="section-block">
        <h2>Key terms</h2>
        <dl class="terms">${chapter.terms.map(([term, def]) => '<div><dt>' + esc(term) + '</dt><dd>' + esc(def) + '</dd></div>').join("")}</dl>
      </section>
      <section class="section-block">
        <h2>Free resources</h2><ul class="result-list">

  document.querySelector("#chapter-quiz").addEventListener("click", () => {

      quizView = "run";
      changeRoute("quizzes");

  document.querySelector("#chapter-cards").addEventListener("click", () => {

    cardState.unknownOnly = false;

function imageSource(figure) {
  return figure.embedded || figure.direct;
}

function renderFigure(figure) {
  return '<figure class="figure"><button class="figure-button" type="button" data-figure="' + figure.id
    + '" aria-label="Enlarge ' + esc(figure.title) + '"><img class="figure-image" src="' + esc(imageSource(figure))
    + '" alt="' + esc(figure.alt) + '"><span class="image-unavailable" hidden>Illustration unavailable. ' + esc(figure.alt) + '</span></button>'
    + '<figcaption><strong>' + esc(figure.title) + '</strong><span>' + esc(figure.by) + ' · ' + esc(figure.license)
    + '</span>' + outside(figure.direct, "Original image") + '</figcaption></figure>';
}

function setImageFallback(image) {
  function showMissing() {
    image.hidden = true;
    image.nextElementSibling.hidden = false;
  }
  image.addEventListener("error", showMissing, { once: true });
  if (image.complete && !image.naturalWidth) showMissing();
}

function openFigure(figure, trigger) {
  lastImageTrigger = trigger;
  document.querySelector("#art-content").innerHTML =
    '<img class="figure-image" src="' + esc(imageSource(figure)) + '" alt="' + esc(figure.alt)
    + '"><p class="image-unavailable" hidden>Illustration unavailable. ' + esc(figure.alt) + '</p><p>' + esc(figure.by)
    + ' · ' + esc(figure.license) + ' · ' + outside(figure.direct, "Open original image") + '</p>';
  setImageFallback(document.querySelector("#art-content img"));
  document.querySelector("#art-title").textContent = figure.title;
  figuresDialog.showModal();
}

figuresDialog.addEventListener("close", () => {
  document.querySelector("#art-content").replaceChildren();
  lastImageTrigger?.focus();
});

function option(value, title, selected) {
  return '<option value="' + esc(value) + '"' + (value === selected ? " selected" : "") + ">" + esc(title) + "</option>";
}

function topicOptions(selected, allTitle) {
  return option("all", allTitle, selected) + ["anatomy", "cma"].map(group =>
    '<optgroup label="' + (group === "anatomy" ? "Anatomy" : "CMA Prep") + '">'
    + option(group, group === "anatomy" ? "All anatomy" : "All CMA areas", selected)
    + CHAPTERS.filter(ch => ch.group === group).map(ch => option(ch.id, ch.title, selected)).join("")
    + "</optgroup>").join("");
}

function topicMatch(filter, id) {
  return filter === "all" || filter === id || byTopic.get(id)?.group === filter;
}

function eligibleQuiz(opts) {
  return QUESTIONS.filter(q => topicMatch(opts.topic, q.topic)
    && (opts.difficulty === "all" || opts.difficulty === q.difficulty));
}

function quizName(topic) {
  return byTopic.get(topic)?.title || { all: "Mixed practice", anatomy: "Mixed anatomy", cma: "Mixed CMA practice" }[topic];
}

function beginQuiz(opts, missed = null, retryTitle = "") {
  const pool = missed || eligibleQuiz(opts).map(q => q.id);
  if (!pool.length) return;
  const length = opts.length === "all" ? pool.length : Math.min(Number(opts.length), pool.length);
  const ids = shuffle(pool).slice(0, length);
  const full = !missed && byTopic.has(opts.topic)
    && opts.difficulty === "all" && length === byTopicQuestionCount(opts.topic);
  progress.active = {
    title: missed ? retryTitle : quizName(opts.topic), topic: opts.topic, retry: Boolean(missed), full,
    ids, index: 0, answers: [], orders: ids.map(id => {
      const q = byQuestion.get(id);
      const count = q.type === "match" ? q.pairs.length : q.options.length;
      const order = Array.from({ length: count }, (_, i) => i);
      return q.type === "boolean" ? order : shuffle(order);
    }),
  };
  quizView = "run";
  saveProgress();
  changeRoute("quizzes");
  focusQuiz("#question-title");
}

function renderQuizCenter() {
  if (quizView === "run" && progress.active) return renderQuestion();
  if (quizView === "result" && progress.latest) return renderResult();
  const levels = option("all", "All difficulties", draft.difficulty)
    + Object.entries(DIFFICULTY).map(([id, name]) => option(id, name, draft.difficulty)).join("");
  main.innerHTML = sectionHead("Quiz Center", "Take a full topic quiz or build a randomized set from all " + QUESTIONS.length + " questions.")
    + `<div class="panel">
      <h2>Build a practice quiz</h2>
      <form id="quiz-config">
        <div class="filter-row">
          <label>Topic<select name="topic">${topicOptions(draft.topic, "All topics · mixed")}</select></label>
          <label>Difficulty<select name="difficulty">${levels}</select></label>
          <label>Questions<select name="length">${[["12","12"], ["25","25"], ["all","All available"]]
            .map(([val, label]) => option(val, label, draft.length)).join("")}</select></label>
        </div>
        <p class="muted" id="pool-count" role="status"></p>
        <div class="button-row"><button class="button primary" type="submit">Start practice</button>
        ${progress.active ? '<button type="button" class="button secondary" id="resume-quiz">Resume saved quiz</button>' : ""}
        ${progress.latest ? '<button type="button" class="button secondary" id="last-result">Last result</button>' : ""}</div>
      </form>
    </div>
    <section class="section-block"><h2>Full topic quizzes</h2>
      <div class="quiz-topic-list">${CHAPTERS.map(ch => `<button class="button secondary" type="button" data-full="${ch.id}">
        <span>${esc(ch.title)}</span><small>${byTopicQuestionCount(ch.id)} questions</small></button>`).join("")}</div>
    </section>`;
  const form = document.querySelector("#quiz-config");
  function refreshPool() {
    draft = Object.fromEntries(new FormData(form));
    const count = eligibleQuiz(draft).length;
    const sessionCount = draft.length === "all" ? count : Math.min(count, Number(draft.length));
    document.querySelector("#pool-count").textContent = count
      ? sessionCount + " of " + count + " available questions will be used."
      : "No questions match these filters.";
    form.querySelector('[type="submit"]').disabled = !count;
  }
  form.addEventListener("change", refreshPool);
  form.addEventListener("submit", event => {
    event.preventDefault();
    refreshPool();
    beginQuiz(draft);
  });
  refreshPool();
  document.querySelector("#resume-quiz")?.addEventListener("click", () => {
    quizView = "run";
    renderQuizCenter();
    focusQuiz("#question-title");
  });
  document.querySelector("#last-result")?.addEventListener("click", () => {
    quizView = "result";
    renderQuizCenter();
    focusQuiz("h1");
  });
  main.querySelectorAll("[data-full]").forEach(button => button.addEventListener("click", () => {
    beginQuiz({ topic: button.dataset.full, difficulty: "all", length: "all" });
  }));
}

function correctAnswer(q, values) {
  return q.type === "match" ? q.pairs.every((_, index) => values[index] === index)
    : values[0] === q.answer;
}

function answerText(q, values) {
  return q.type === "match"
    ? q.pairs.map(([term], i) => term + " → " + q.pairs[values[i]][1]).join(" · ")
    : q.options[values[0]];
}

function expectedText(q) {
  return answerText(q, q.type === "match" ? q.pairs.map((_, i) => i) : [q.answer]);
}

function focusQuiz(selector) {
  window.requestAnimationFrame(() => {
    const node = main.querySelector(selector);
    if (node) node.focus();
  });
}

function renderQuestion() {
  const attempt = progress.active;
  const q = byQuestion.get(attempt.ids[attempt.index]);
  const order = attempt.orders[attempt.index];
  const previous = attempt.answers[attempt.index];
  const answered = Boolean(previous);
  const last = attempt.index === attempt.ids.length - 1;
  const scoreCard = answered ? `
    <div class="answer-feedback ${previous.correct ? "good" : "incorrect"}" id="answer-feedback" tabindex="-1">
      <strong>${previous.correct ? "Correct" : "Incorrect"}</strong>
      ${previous.correct ? "" : '<p>Correct answer: ' + esc(expectedText(q)) + '</p>'}
      <p>${esc(q.explanation)}</p>
    </div>` : "";
  const disabled = answered ? " disabled" : "";
  const controls = q.type === "match"
    ? '<p class="muted">Choose one distinct answer for each row.</p><div class="matches">'
      + q.pairs.map(([term], row) => '<label><span>' + esc(term) + '</span><select name="match-' + row
        + '" required' + disabled + '>' + option("", "Select a match", previous?.values[row] ?? "")
        + order.map(index => option(index, q.pairs[index][1], previous?.values[row])).join("") + '</select></label>').join("")
      + '</div>'
    : '<div class="options">' + order.map(index => {
      const style = !answered ? "" : index === q.answer ? " correct" : previous.values[0] === index ? " wrong" : "";
      return '<label class="answer-option' + style + '"><input type="radio" name="choice" value="' + index
        + '" required' + disabled + (previous?.values[0] === index ? " checked" : "")
        + '><span>' + esc(q.options[index]) + '</span></label>';
    }).join("") + "</div>";
  main.innerHTML = sectionHead(attempt.title + (attempt.retry ? " · Missed questions" : ""))
    + `<section class="panel quiz-panel">
      <div class="quiz-meta"><span>Question ${attempt.index + 1} of ${attempt.ids.length}</span>
        <span>${esc(DIFFICULTY[q.difficulty])} · ${esc(TYPE_NAMES[q.type])}</span></div>
      <progress value="${attempt.answers.length}" max="${attempt.ids.length}" aria-label="Quiz questions answered"></progress>
      <form id="question-form">
        <h2 id="question-title" tabindex="-1">${esc(q.prompt)}</h2>
        <fieldset aria-labelledby="question-title">${controls}</fieldset>
        <p id="form-error" class="error" role="alert"></p>
        ${scoreCard}
        <div class="button-row quiz-actions">
          ${answered ? '<button class="button primary" type="button" id="quiz-next">'
            + (last ? "See results" : "Next question") + "</button>"
            : '<button class="button primary" type="submit">Check answer</button>'}
          <button class="button secondary" type="button" id="pause-quiz">Back to quiz options</button>
        </div>
      </form></section>`;
  const form = document.querySelector("#question-form");
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (answered) return;
    const values = [...new FormData(form).values()].map(Number);
    if (q.type === "match" && new Set(values).size !== values.length) {
      document.querySelector("#form-error").textContent = "Use each match once.";
      return;
    }
    attempt.answers.push({ values, correct: correctAnswer(q, values) });
    saveProgress();
    renderQuestion();
    focusQuiz("#answer-feedback");
  });
  document.querySelector("#pause-quiz").addEventListener("click", () => {
    quizView = "choose";
    renderQuizCenter();
    focusQuiz("h1");
  });
  document.querySelector("#quiz-next")?.addEventListener("click", () => {
    if (!last) {
      attempt.index++;
      saveProgress();
      renderQuestion();
      focusQuiz("#question-title");
      return;
    }
    if (attempt.full) {
      const score = attempt.answers.filter(a => a.correct).length;
      const old = progress.completed[attempt.topic];
      progress.completed[attempt.topic] = {
        score, total: attempt.ids.length, best: Math.max(score, old?.best || 0),
      };
    }
    progress.latest = attempt;
    progress.active = null;
    quizView = "result";
    saveProgress();
    renderQuizCenter();
    focusQuiz("h1");
  });
}

function renderResult() {
  const result = progress.latest;
  const misses = result.ids.filter((_, i) => !result.answers[i].correct);
  const score = result.ids.length - misses.length;
  const percent = Math.round(score * 100 / result.ids.length);
  main.innerHTML = sectionHead("Quiz complete", result.title)
    + `<section class="panel score-panel"><h2>Your score</h2><p class="score">${score} / ${result.ids.length}
      <small>${percent}%</small></p><div class="button-row">
      ${misses.length ? '<button class="button primary" type="button" id="retry-missed">Retry missed questions</button>' : ""}
      <button class="button secondary" type="button" id="another-quiz">Choose another quiz</button>
      ${link("progress", "See progress", "button secondary")}
      </div></section>
      <section class="section-block"><h2>Missed questions (${misses.length})</h2>
      ${misses.length ? '<ol class="review-list">' + result.ids.map((id, index) => {
        const q = byQuestion.get(id);
        const answer = result.answers[index];
        return answer.correct ? "" : '<li><strong>' + esc(q.prompt) + '</strong><p>Your answer: '
          + esc(answerText(q, answer.values)) + '</p><p>Correct answer: ' + esc(expectedText(q))
          + '</p><p>' + esc(q.explanation) + '</p></li>';
      }).join("") + "</ol>" : '<p>No missed questions in this attempt.</p>'}
      </section>`;
  document.querySelector("#retry-missed")?.addEventListener("click", () => {
    beginQuiz({ topic: result.topic, difficulty: "all", length: "all" }, misses, result.title);
  });
  document.querySelector("#another-quiz").addEventListener("click", () => {
    quizView = "choose";
    renderQuizCenter();
    focusQuiz("h1");
  });
}

function resetCardOrder() {
  cardState.order = null;
  cardState.index = 0;
  cardState.flipped = false;
}

function flashDeck() {
  const candidates = termCards.filter(card => topicMatch(cardState.topic, card.topic)
    && (!cardState.unknownOnly || !progress.known.includes(card.id)));
  const ordered = cardState.order;
  if (!ordered) return candidates;
  const rank = new Map(ordered.map((id, i) => [id, i]));
  return candidates.sort((a, b) => (rank.get(a.id) ?? Infinity) - (rank.get(b.id) ?? Infinity));
}

function renderFlashcards(refocus = "") {
  const deck = flashDeck();
  const cardCount = deck.length;
  cardState.index = Math.max(0, Math.min(cardState.index, cardCount - 1));
  const card = deck[cardState.index];
  const known = card && progress.known.includes(card.id);
  const knownCount = termCards.filter(entry => topicMatch(cardState.topic, entry.topic) && progress.known.includes(entry.id)).length;
  main.innerHTML = sectionHead("Flashcards", "Flip a card to see its definition. Mark it known when you can recall it on your own.")
    + `<section class="panel deck-panel">
      <div class="filter-row flash-controls">
        <label>Topic<select id="flash-topic">${topicOptions(cardState.topic, "All terms")}</select></label>
        <label class="checkbox"><input id="flash-unknown" type="checkbox" ${cardState.unknownOnly ? "checked" : ""}>
          Show only unknown cards</label>
      </div>
      <p class="muted" id="flash-status" role="status">${card ? "Card " + (cardState.index + 1)
        + " of " + cardCount + " · " : ""}${knownCount} known in this topic</p>
      ${card ? '<button id="flip-card" class="flip-card" type="button" aria-describedby="flash-face" aria-label="' + (cardState.flipped ? "Show term for " : "Show definition of ")
        + esc(card.term) + '"><span class="card-side">' + (cardState.flipped ? "Definition" : "Term")
        + '</span><span class="card-content">' + esc(cardState.flipped ? card.definition : card.term)
        + '</span><span class="card-hint">Flip card</span></button>'
        : '<p class="empty" id="empty-deck" tabindex="-1">No cards match this selection.</p>'}
      <p id="flash-face" class="sr-only" role="status">${card ? esc(cardState.flipped ? card.definition : card.term) : ""}</p>
      <div class="button-row">
        <button class="button secondary" type="button" id="prev-card" ${cardCount < 2 ? "disabled" : ""}>Previous</button>
        <button class="button secondary" type="button" id="next-card" ${cardCount < 2 ? "disabled" : ""}>Next</button>
        <button class="button secondary" type="button" id="shuffle-cards" ${cardCount < 2 ? "disabled" : ""}>Shuffle</button>
        ${card ? '<button class="button primary" id="mark-card" type="button">' + (known ? "Mark as unknown" : "Mark as known") + '</button>' : ""}
      </div>
    </section>`;
  const focus = main.querySelector(refocus || "#flash-topic");
  if (refocus) (focus?.disabled ? main.querySelector("#flip-card") : focus)?.focus({ preventScroll: true });
  document.querySelector("#flash-topic").addEventListener("change", event => {
    cardState.topic = event.currentTarget.value;
    resetCardOrder();
    renderFlashcards("#flash-topic");
  });
  document.querySelector("#flash-unknown").addEventListener("change", event => {
    cardState.unknownOnly = event.currentTarget.checked;
    resetCardOrder();
    renderFlashcards("#flash-unknown");
  });
  function step(offset, target) {
    cardState.index = (cardState.index + offset + cardCount) % cardCount;
    cardState.flipped = false;
    renderFlashcards(target);
  }
  document.querySelector("#prev-card").addEventListener("click", () => step(-1, "#prev-card"));
  document.querySelector("#next-card").addEventListener("click", () => step(1, "#next-card"));
  document.querySelector("#shuffle-cards").addEventListener("click", () => {
    cardState.order = shuffle(deck.map(entry => entry.id));
    cardState.index = 0;
    cardState.flipped = false;
    renderFlashcards("#shuffle-cards");
  });
  document.querySelector("#flip-card")?.addEventListener("click", () => {
    cardState.flipped = !cardState.flipped;
    renderFlashcards("#flip-card");
  });
  document.querySelector("#mark-card")?.addEventListener("click", () => {
    progress.known = known ? progress.known.filter(id => id !== card.id) : [...progress.known, card.id];
    saveProgress();
    cardState.flipped = false;
    renderFlashcards(cardState.unknownOnly ? (cardCount === 1 ? "#empty-deck" : "#flip-card") : "#mark-card");
  });
}

function haystack(row) {
  return [row.title, row.source_site, row.format, row.category, row.subcategory, row.description].join(" ");
}

function renderResources() {
  main.innerHTML = sectionHead("Resource Library", "Browse the verified free resources from your catalog. The links open the originals.")
    + `<form class="filter-row resource-filters" role="search">
      <label>Search resources<input id="resource-search" type="search" value="${esc(resourceState.query)}" placeholder="Search by title, topic, or publisher"></label>
      <label>Category<select id="resource-category">
      ${["all", ...new Set(RESOURCES.map(row => row.category))].map(v => option(v, v === "all" ? "All categories" : v, resourceState.category)).join("")}
      </select></label>
    </form>
    <p id="resource-count" class="muted" role="status"></p>
    <div class="table-scroll" role="region" aria-label="Verified resources table" tabindex="0">
      <table><thead><tr><th scope="col">Title</th><th scope="col">Source</th><th scope="col">Format</th>
      <th scope="col">Signup needed</th></tr></thead><tbody id="resource-rows"></tbody></table>
    </div>`;
  const input = document.querySelector("#resource-search");
  const category = document.querySelector("#resource-category");
  function showRows() {
    resourceState = { query: input.value, category: category.value };
    const terms = input.value.toLowerCase().trim().split(/\s+/);
    const rows = RESOURCES.filter(row => (category.value === "all" || row.category === category.value)
      && terms.every(term => haystack(row).toLowerCase().includes(term)));
    document.querySelector("#resource-count").textContent = rows.length
      ? rows.length + " of " + RESOURCES.length + " resources" : "No matching resources.";
    document.querySelector("#resource-rows").innerHTML = rows.map(row => `<tr>
      <th scope="row">${outside(row.url, row.title)}<small>${esc(row.subcategory)}</small></th>
      <td>${esc(row.source_site)}</td><td>${esc(row.format)}</td>
      <td>${row.signup_required.toLowerCase() === "yes" ? "Yes" : "No"}</td></tr>`).join("");
  }
  input.addEventListener("input", showRows);
  category.addEventListener("change", showRows);
  input.form.addEventListener("submit", event => { event.preventDefault(); showRows(); });
  showRows();
}

function renderCredits() {
  main.innerHTML = sectionHead("Credits", "Study text, definitions, and quiz questions were written for this hub. Resource credits follow the supplied catalog.")
    + `<section class="section-block"><h2>Illustrations</h2><ul class="credit-list">${FIGURES.map(figure => `<li>
      <div><strong>${esc(figure.title)}</strong><small>${esc(byTopic.get(figure.topic).title)}</small></div>
      <div>${esc(figure.by)}<small>${esc(figure.license)}</small></div>
      <div>${outside(figure.direct, "Image file")} · ${outside(figure.source, "Source and license")}</div></li>`).join("")}
      </ul></section>
      <section class="section-block"><h2>Catalog resources</h2><ul class="credit-list">${RESOURCES.map(row => `
      <li><div>${outside(row.url, row.title)}<small>${esc(row.subcategory)}</small></div>
      <div>${esc(row.source_site)}</div><div>${esc(row.license)}</div></li>`).join("")}</ul></section>`;
}

function renderProgress() {
  const { total, known } = progressSummary();
  main.innerHTML = sectionHead("Your progress", total + " of " + CHAPTERS.length + " full quizzes finished · "
    + known + " of " + termCards.length + " flashcards known")
    + (storageAvailable ? '<p class="muted">Progress is saved in this browser when local storage is available.</p>'
      : '<p class="study-note">Browser storage is unavailable. Progress lasts until you close or reload this page.</p>')
    + '<ul class="progress-list">' + CHAPTERS.map(ch => {
      const status = progress.completed[ch.id];
      const detail = status ? "Best " + status.best + "/" + status.total + " · Last " + status.score + "/" + status.total : "Not completed";
      return "<li>" + link(ch.id, ch.title) + '<span class="badge' + (status ? " good" : "") + '">' + esc(detail) + "</span></li>";
    }).join("") + "</ul>";
}

document.querySelector(".skip-link").addEventListener("click", event => {
  event.preventDefault();
  main.focus();
});
window.addEventListener("hashchange", () => renderRoute());
renderRoute(true);

  </script>
</body>
